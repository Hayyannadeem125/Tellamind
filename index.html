<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050403" />
    <meta name="description" content="TellaMind is a Michigan-based technology company building business websites, mobile apps, custom software, and AI automation for teams worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TellaMind" />
    <meta property="og:title" content="Web, App &amp; Custom Software Development | TellaMind" />
    <meta property="og:description" content="Business websites, mobile apps, custom software, and AI automation for teams worldwide." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web, App &amp; Custom Software Development | TellaMind" />
    <meta name="twitter:description" content="Business websites, mobile apps, custom software, and AI automation for teams worldwide." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <title>Web, App &amp; Custom Software Development | TellaMind</title>
    <script>
      try {
        const pagesRedirect = sessionStorage.getItem('gh-pages-redirect');
        if (pagesRedirect && pagesRedirect.startsWith('%BASE_URL%')) {
          sessionStorage.removeItem('gh-pages-redirect');
          history.replaceState(null, '', pagesRedirect);
        }
        const savedTheme = localStorage.getItem('tellamind-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.style.colorScheme = savedTheme === 'light' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = savedTheme === 'light' ? '#f3f7f2' : '#050403';
        if (savedTheme === 'light') {
          const heroImage = document.createElement('link');
          heroImage.rel = 'preload';
          heroImage.as = 'image';
          heroImage.href = '%BASE_URL%Golden_AI_tellamind.avif';
          heroImage.type = 'image/avif';
          heroImage.fetchPriority = 'high';
          document.head.append(heroImage);
        }
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
