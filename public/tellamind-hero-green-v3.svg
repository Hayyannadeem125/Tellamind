<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" fill="none">
  <style>
    .hero-cube-main { transform-box: fill-box; transform-origin: center; animation: hero-main-float 4.8s ease-in-out infinite; }
    .hero-cube-small { transform-box: fill-box; transform-origin: center; animation-duration: 5.1s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .hero-orbit-flow { fill: none; stroke: #D6E4C4; stroke-width: 2; stroke-linecap: round; }
    .hero-orbit-flow ellipse { stroke-dasharray: 46 355; animation: orbit-tracer-travel 4s linear infinite; will-change: stroke-dashoffset; }
    .hero-orbit-flow ellipse:nth-child(2) { animation-duration: 4.5s; animation-delay: -1.6s; opacity: .72; }
    .hero-orbit-flow ellipse:nth-child(3) { animation-duration: 3.6s; animation-delay: -2.2s; opacity: .58; }
    .hero-cube-small-1 { animation-name: hero-cube-path-1; }
    .hero-cube-small-2 { animation-name: hero-cube-path-2; animation-delay: -1.4s; }
    .hero-cube-small-3 { animation-name: hero-cube-path-3; animation-delay: -2.8s; }
    .hero-cube-small-4 { animation-name: hero-cube-path-4; animation-delay: -4.2s; }
    @keyframes hero-main-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes orbit-tracer-travel { to { stroke-dashoffset: -401; } }
    @keyframes hero-cube-path-1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-7px,-11px) rotate(-2deg); } }
    @keyframes hero-cube-path-2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(7px,-10px) rotate(2deg); } }
    @keyframes hero-cube-path-3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(7px,9px) rotate(-2deg); } }
    @keyframes hero-cube-path-4 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-7px,8px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .hero-cube-main, .hero-cube-small, .hero-orbit-flow ellipse { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="glow"><stop stop-color="#548466" stop-opacity=".32"/><stop offset="1" stop-color="#548466" stop-opacity="0"/></radialGradient>
    <linearGradient id="forestTop" x1="-70" y1="-130" x2="115" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#E9FFD9"/><stop offset=".3" stop-color="#78B86F"/><stop offset="1" stop-color="#28613A"/></linearGradient>
    <linearGradient id="forestLeft" x1="-120" y1="-50" x2="10" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#397D49"/><stop offset="1" stop-color="#123B28"/></linearGradient>
    <linearGradient id="forestRight" x1="0" y1="-10" x2="130" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#4C9855"/><stop offset="1" stop-color="#1B5032"/></linearGradient>
    <linearGradient id="oliveTop" x1="-70" y1="-130" x2="115" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#F5FFD0"/><stop offset=".4" stop-color="#B6CE61"/><stop offset="1" stop-color="#708A32"/></linearGradient>
    <linearGradient id="oliveLeft" x1="-120" y1="-50" x2="10" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#9BAF4C"/><stop offset="1" stop-color="#4D6428"/></linearGradient>
    <linearGradient id="oliveRight" x1="0" y1="-10" x2="130" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#C3D76E"/><stop offset="1" stop-color="#708631"/></linearGradient>
    <linearGradient id="tealTop" x1="-70" y1="-130" x2="115" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#E0FFF2"/><stop offset=".4" stop-color="#72C7A5"/><stop offset="1" stop-color="#27866B"/></linearGradient>
    <linearGradient id="tealLeft" x1="-120" y1="-50" x2="10" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#4AAB8B"/><stop offset="1" stop-color="#145542"/></linearGradient>
    <linearGradient id="tealRight" x1="0" y1="-10" x2="130" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#75D0AD"/><stop offset="1" stop-color="#26775C"/></linearGradient>
    <linearGradient id="emeraldTop" x1="-70" y1="-130" x2="115" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#E1FFE6"/><stop offset=".4" stop-color="#76C886"/><stop offset="1" stop-color="#31804A"/></linearGradient>
    <linearGradient id="emeraldLeft" x1="-120" y1="-50" x2="10" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#4B9E5C"/><stop offset="1" stop-color="#1D5837"/></linearGradient>
    <linearGradient id="emeraldRight" x1="0" y1="-10" x2="130" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#8AD391"/><stop offset="1" stop-color="#34774A"/></linearGradient>
    <linearGradient id="sageTop" x1="-70" y1="-130" x2="115" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#F0FFE8"/><stop offset=".4" stop-color="#A8D9AD"/><stop offset="1" stop-color="#548761"/></linearGradient>
    <linearGradient id="sageLeft" x1="-120" y1="-50" x2="10" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#77B685"/><stop offset="1" stop-color="#315F43"/></linearGradient>
    <linearGradient id="sageRight" x1="0" y1="-10" x2="130" y2="145" gradientUnits="userSpaceOnUse"><stop stop-color="#B1DDB4"/><stop offset="1" stop-color="#4B8157"/></linearGradient>
    <filter id="shadow" x="-80%" y="-80%" width="260%" height="280%"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="28"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <g id="cube-forest" stroke="#E4F5E5" stroke-opacity=".72" stroke-width="1.5" stroke-linejoin="round">
      <path d="M0-128 125-58 0 14-125-58 0-128Z" fill="url(#forestTop)"/><path d="M-125-58 0 14v144l-125-72V-58Z" fill="url(#forestLeft)"/><path d="M125-58 0 14v144l125-72V-58Z" fill="url(#forestRight)"/><path d="M0-128v142M-125-58 0 14l125-72M0 14v144" fill="none" stroke="#EAF8EB" stroke-opacity=".68"/>
    </g>
    <g id="cube-olive" stroke="#F7FFE9" stroke-opacity=".72" stroke-width="1.35" stroke-linejoin="round">
      <path d="M0-128 125-58 0 14-125-58 0-128Z" fill="url(#oliveTop)"/><path d="M-125-58 0 14v144l-125-72V-58Z" fill="url(#oliveLeft)"/><path d="M125-58 0 14v144l125-72V-58Z" fill="url(#oliveRight)"/><path d="M0-128v142M-125-58 0 14l125-72M0 14v144" fill="none" stroke="#F7FFE9" stroke-opacity=".56"/>
    </g>
    <g id="cube-teal" stroke="#E9FFF8" stroke-opacity=".72" stroke-width="1.35" stroke-linejoin="round">
      <path d="M0-128 125-58 0 14-125-58 0-128Z" fill="url(#tealTop)"/><path d="M-125-58 0 14v144l-125-72V-58Z" fill="url(#tealLeft)"/><path d="M125-58 0 14v144l125-72V-58Z" fill="url(#tealRight)"/><path d="M0-128v142M-125-58 0 14l125-72M0 14v144" fill="none" stroke="#E9FFF8" stroke-opacity=".56"/>
    </g>
    <g id="cube-emerald" stroke="#ECFFEF" stroke-opacity=".72" stroke-width="1.35" stroke-linejoin="round">
      <path d="M0-128 125-58 0 14-125-58 0-128Z" fill="url(#emeraldTop)"/><path d="M-125-58 0 14v144l-125-72V-58Z" fill="url(#emeraldLeft)"/><path d="M125-58 0 14v144l125-72V-58Z" fill="url(#emeraldRight)"/><path d="M0-128v142M-125-58 0 14l125-72M0 14v144" fill="none" stroke="#ECFFEF" stroke-opacity=".56"/>
    </g>
    <g id="cube-sage" stroke="#F3FFF2" stroke-opacity=".72" stroke-width="1.35" stroke-linejoin="round">
      <path d="M0-128 125-58 0 14-125-58 0-128Z" fill="url(#sageTop)"/><path d="M-125-58 0 14v144l-125-72V-58Z" fill="url(#sageLeft)"/><path d="M125-58 0 14v144l125-72V-58Z" fill="url(#sageRight)"/><path d="M0-128v142M-125-58 0 14l125-72M0 14v144" fill="none" stroke="#F3FFF2" stroke-opacity=".56"/>
    </g>
  </defs>
  <ellipse cx="470" cy="370" rx="330" ry="300" fill="url(#glow)" filter="url(#blur)"/>
  <g class="hero-orbit-lines" stroke="#548466" stroke-opacity=".28" stroke-width="1">
    <ellipse cx="455" cy="365" rx="342" ry="138" transform="rotate(-25 455 365)"/>
    <ellipse cx="455" cy="365" rx="342" ry="138" transform="rotate(35 455 365)"/>
    <ellipse cx="455" cy="365" rx="275" ry="180" transform="rotate(90 455 365)" stroke-opacity=".13"/>
  </g>
  <g class="hero-orbit-flow" stroke-opacity=".76">
    <ellipse cx="455" cy="365" rx="342" ry="138" transform="rotate(-25 455 365)"/>
    <ellipse cx="455" cy="365" rx="342" ry="138" transform="rotate(35 455 365)"/>
    <ellipse cx="455" cy="365" rx="275" ry="180" transform="rotate(90 455 365)"/>
  </g>
  <g filter="url(#shadow)">
    <g class="hero-cube-main"><use href="#cube-forest" transform="translate(455 335) scale(1.22)"/></g>
    <g class="hero-cube-small hero-cube-small-1">
      <use href="#cube-olive" transform="translate(260 280) scale(.55) rotate(-9)"/>
    </g>
    <g class="hero-cube-small hero-cube-small-2"><use href="#cube-teal" transform="translate(640 225) scale(.54) rotate(10)"/></g>
    <g class="hero-cube-small hero-cube-small-3"><use href="#cube-emerald" transform="translate(665 475) scale(.61) rotate(8)"/></g>
    <g class="hero-cube-small hero-cube-small-4"><use href="#cube-sage" transform="translate(300 555) scale(.55) rotate(-7)"/></g>
  </g>
  <g fill="#E9F8EA"><circle cx="154" cy="183" r="3"/><circle cx="756" cy="329" r="2.5"/><circle cx="715" cy="585" r="3"/><circle cx="257" cy="590" r="2"/></g>
  <g stroke="#548466" stroke-opacity=".45"><path d="M155 166v34m-17-17h34M755 313v32m-16-16h32M716 568v34m-17-17h34"/></g>
</svg>
